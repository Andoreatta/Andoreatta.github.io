[en]
    contentDir = 'content/en'
    disabled = false
    locale = 'en-US'
    direction = 'ltr'
    label = 'English'
    [en.pagination]
        ## /page/1/ aliases are duplicates of the list URL; they are not needed
        ## for navigation and were 127 crawlable soft redirects.
        disableAliases = true
        pagerSize = 8
        path = 'page'

[pt-br]
    contentDir = 'content/pt-br'
    disabled = false
    locale = 'pt-BR'
    direction = 'ltr'
    label = 'Português (Brasil)'
    [pt-br.pagination]
        disableAliases = true
        pagerSize = 8
        path = 'page'
    [pt-br.params]
        description = 'Experimentos seriais em software, sistemas e redes.'
