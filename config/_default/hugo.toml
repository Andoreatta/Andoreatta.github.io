## Base URL for the site
## Switch to 'https://serial.experiments.network/' when the custom domain is attached.
baseURL = 'https://andoreatta.github.io/'
## Site title
title = 'srl.exp.net'
## Use hugo-brewm theme
theme = 'hugo-brewm'
## Enable Git information for pages, (e.g. lastMod date information)
enableGitInfo = true
## Convert all URLs to absolute URLs
canonifyURLs = true
## Default language for content
defaultContentLanguage = 'en'
## Keep the default language at the site root; Portuguese lives under /pt-br/
defaultContentLanguageInSubdir = false
## Do not render placeholders for incomplete translations
enableMissingTranslationPlaceholders = false
## Files to ignore when building site
ignoreFiles = [ '\.redacted', '\.old','\.bak', '\.tmp', '\.swp', '\.DS_Store']
## Generate a robots.txt
enableRobotsTXT = true

## Front matter field configurations
[frontmatter]
    date = [':default']
    expiryDate = ['expiryDate', 'unpublishdate', ':default']
    lastmod = ['lastmod', ':default']

## Markup configuration
[markup]

    [markup.tableOfContents]
        startLevel = 2
        endLevel = 3
        ordered = false

    [markup.highlight]
        codeFences = true
        lineNoStart = 1
        lineNos = false
        lineNumbersInTable = true
        noClasses = false
        tabWidth = 4

    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
        [markup.goldmark.extensions]
            [markup.goldmark.extensions.passthrough]
                enable = true
                [markup.goldmark.extensions.passthrough.delimiters]
                    ## Keep explicit `$$`/environment math, but do not treat `$` or
                    ## `\[` as math: the pentesting notes are full of shell variables
                    ## (`$TARGET`, `$IP`) and escaped literal brackets.
                    block = [['$$', '$$'], ['\begin{equation}', '\end{equation}'], ['\begin{align}', '\end{align}']]
                    inline = [['\(', '\)']]

[outputs]
    home = ['html', 'rss', 'json']
    ## Tag pages are discovery aids, not feeds. Keeping RSS on every tag term
    ## generated ~16 MB of full-content XML from the imported notes.
    taxonomy = ['html']
    term = ['html']

[sitemap]
    changeFreq = 'monthly'

[services.rss]
    limit = -1

## Taxonomy configuration
[taxonomies]
    category = 'categories'
    tag = 'tags'

## Related notes are scored by shared tags.
[related]
    threshold = 20
    includeNewer = true
    toLower = true
    [[related.indices]]
        name = 'tags'
        weight = 100

## Site parameters
[params]
    title = 'srl.exp.net'
    description = 'Serial experiments on software, systems, and networks.'
    copyright = '&copy; 2026 srl.exp.net'
    extMeta = true
    coffeeStat = false
    AllowAIRobots = false
    ZenMode = false
    DisableFootBar = false
    unifiedFooter = true

    [params.author]
        name = 'srl'

    [params.comments]
        disabled = true

    [params.logo]
        logoType = true

    [params.favicon]
        svg = '/favicon.svg'

    [params.feed]
        ## The terminal/ASCII look is intentionally image-free.
        flowlines = false
        flowlinesLimit = 21

    [params.home]
        disableSlide = true
        disableListing = true
        featuredListing = ['categories']

    [params.posts]
        justifying = false
        noIndent = false
        ## Use the sans/book face for articles; custom.css maps it to Atkinson Hyperlegible.
        sfdefault = true
        colophon = true
        disableHistory = false
        related = true
        ## Keep post pages clean; re-enable for the full share row.
        share = false
        secnum = false

    [params.RSS]
        limit = 20
        content = 20

    [params.search]
        enable = true
        pagefind = true

    [params.socialCard]
        enable = true
        ## Update this to https://serial.experiments.network/... with the custom domain.
        images = 'https://andoreatta.github.io/images/social-card.png'

    [params.typeface]
        webSafe = false
        ## The actual families are overridden in assets/css/custom.css.
        ## These values only select the theme fallback stylesheets.
        roman = 'crimson'
        sans = 'inter'
        localHost = false

    ## Dark-only palette. Both light and dark variants intentionally point at
    ## the same near-black/tan/pink colors so system preference cannot produce
    ## a light page.
    [params.style.light]
        ac = '#d2738a'
        bg = '#0a0a0a'
        fg = '#c1b492'
        mid = '#8c7c66'
        [params.style.light.less]
            ac = '#e08ba0'
            bg = '#1a1418'
            fg = '#d8cbb0'
            mid = '#a5947c'
        [params.style.light.more]
            ac = '#f08ca3'
            bg = '#000000'
            fg = '#e0d4b8'
            mid = '#a5947c'
    [params.style.dark]
        ac = '#d2738a'
        bg = '#0a0a0a'
        fg = '#c1b492'
        mid = '#8c7c66'
        [params.style.dark.less]
            ac = '#e08ba0'
            bg = '#1a1418'
            fg = '#d8cbb0'
            mid = '#a5947c'
        [params.style.dark.more]
            ac = '#f08ca3'
            bg = '#000000'
            fg = '#e0d4b8'
            mid = '#a5947c'

    [params.analytics]
        ## Load layouts/partials/analytics.html in <head>; used here for the
        ## language redirect and font preload, not for analytics.
        append = 'head'
