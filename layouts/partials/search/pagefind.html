{{ "<!-- pagefind.html -->" | safeHTML }}
<div id="search" class="on-hull">
    <div role="presentation" class="screening js-cgpn"></div>
</div>
<script>
(function () {
    var initialised = false;
    var loading = false;

    function initPageFind() {
        if (initialised || loading) {
            return;
        }
        loading = true;

        var script = document.createElement('script');
        script.src = '{{ "pagefind/pagefind-ui.js" | relURL }}';
        script.onload = function () {
            new PagefindUI({
                element: '#search',
                showImages: false,
                showSubResults: true,
                showFilters: true,
                translations: {
                    placeholder: '{{ i18n "search" }}'
                }
            });

            var input = document.querySelector('.pagefind-ui__search-input');
            if (input) {
                input.setAttribute('aria-label', input.getAttribute('placeholder'));
                input.setAttribute('name', input.getAttribute('placeholder'));
            }

            initialised = true;
        };
        script.onerror = function () {
            loading = false;
        };
        document.head.appendChild(script);
    }

    var details = document.getElementById('has-search');
    if (details) {
        details.addEventListener('toggle', function () {
            if (details.open) {
                initPageFind();
            }
        });
        if (details.open) {
            initPageFind();
        }
    }
})();
</script>
